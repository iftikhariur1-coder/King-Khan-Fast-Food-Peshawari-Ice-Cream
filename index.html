<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050403">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="King Khan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#111111">
<title>King Khan Fast Food &amp; Peshawari Ice Cream</title>
<style>
:root{--bg:#050403;--panel:#141008;--panel2:#1d160b;--ink:#fff6ea;--muted:#dcc7a4;--red:#c1121f;--gold:#f5b942;--line:#4a3a18;--green:#168b52;--mapbg:#e8e4d9;--park:#b8d5a2;--water:#b3d8e7;--road:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:125px}
body{margin:0;background:linear-gradient(180deg,#0a0705 0,#050403 50%,#030201 100%) var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.45}
a{color:inherit;text-decoration:none}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;will-change:transform;background:radial-gradient(40% 30% at 20% 15%,rgba(245,185,66,.17),transparent 70%),radial-gradient(35% 28% at 85% 32%,rgba(214,162,58,.13),transparent 70%),radial-gradient(45% 35% at 30% 72%,rgba(245,185,66,.11),transparent 70%),radial-gradient(40% 30% at 90% 90%,rgba(245,185,66,.15),transparent 70%);animation:smoke 26s ease-in-out infinite alternate}
@keyframes smoke{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,3%,0) scale(1.12)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
.cover{background:#000;border-bottom:3px solid var(--gold)}.cover img{display:block;width:100%;max-width:1100px;height:auto;margin:0 auto}
header{padding:14px 16px 6px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{margin:0;font-size:clamp(2rem,8vw,3.7rem);font-weight:900;letter-spacing:2px;line-height:1.05}
h1 span:first-child{color:var(--gold)}h1 span:last-child{color:#fff}
.sub{margin-top:10px;font-size:clamp(.78rem,2.8vw,1rem);font-weight:800;letter-spacing:2px;color:#eee}
.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:15px}
.tags span{background:#1d160a;border:1px solid #8a6420;border-radius:99px;padding:6px 11px;font-size:.78rem;color:#f8e8c7}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px max(12px,calc((100% - 900px)/2))}
.qa a{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:700;font-size:.88rem}
.qa a:first-child{border-color:#5b2c2f}.qa b{font-size:1.1rem}
.bar{position:sticky;top:0;z-index:10;background:rgba(5,4,3,.93);backdrop-filter:blur(10px);padding:12px max(12px,calc((100% - 900px)/2));border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 13px}
.search span{font-size:1.1rem}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);padding:13px 0;font-size:1rem}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
nav a{white-space:nowrap;flex-shrink:0;border:1px solid var(--line);border-radius:99px;padding:7px 11px;background:var(--panel);font-size:.82rem;font-weight:700}
nav a:hover{border-color:var(--gold)}
main{max-width:900px;margin:auto;padding:8px 12px 100px}
section[id]{scroll-margin-top:150px}
main section{margin:16px 0 24px}
main section h2{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:0 2px 10px;margin:0 0 12px;font-size:1.25rem}
main section h2 small{display:block;color:var(--muted);font-size:.8rem;font-weight:400;margin-top:2px}
main section h2 em{font-style:normal;font-size:.72rem;font-weight:700;color:var(--gold);background:#2a200c;border-radius:99px;padding:5px 9px;white-space:nowrap}
.dish{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;margin:10px 0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px}
.thumb{width:92px;height:82px;flex:0 0 92px;border-radius:11px;overflow:hidden;background:#241b0c;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;flex:1}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.name{font-weight:800;font-size:1rem;overflow-wrap:anywhere}
.price{color:var(--gold);font-weight:900;white-space:nowrap;font-size:.98rem}
.free{margin-top:3px;font-size:.72rem;font-weight:700;color:#7ff0b0;line-height:1.3}
.price.oos{color:#ff8a90;font-size:.82rem}
.wa.dis{background:#3a3a3a;color:#b5b5b5;box-shadow:none;pointer-events:none}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 2px}
.chip{border:1px solid #6b5420;background:#1d160b;color:var(--ink);border-radius:99px;padding:7px 10px;font-size:.8rem;font-weight:700;cursor:pointer}
.chip.on{background:#6b4a14;border-color:var(--gold);color:#ffe0a0}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .wa{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--green);border-radius:9px;padding:10px 8px;font-size:.83rem;font-weight:800}
.wa svg{width:18px;height:18px;fill:#fff;flex:0 0 auto}
.add{border:1px solid #a03a35;background:#5a1d1a;color:#fff;border-radius:9px;padding:10px 13px;font-size:.85rem;font-weight:800;cursor:pointer}
.add.ok{background:#185f3d;border-color:#278c5c}
#empty{display:none;text-align:center;padding:30px 15px;color:var(--muted)}
.loc{max-width:876px;margin:0 auto 25px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.loc>a{display:block;height:180px;background:var(--mapbg)}
.loc svg{display:block;width:100%;height:100%}
.lb{padding:16px}.lb h3{margin:0 0 7px;font-size:1.2rem}.lb p{color:#ddd;margin:0 0 10px}
.code{display:inline-block;color:var(--gold);font-size:.85rem;margin-bottom:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns a{background:var(--red);border-radius:9px;padding:10px 13px;font-weight:800;font-size:.85rem}.btns a.alt{background:#333;border:1px solid #555}
.vis{display:inline-block;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-weight:700;color:var(--ink)}.inst{margin-top:12px;font:inherit;font-weight:800;color:#2a1600;background:linear-gradient(135deg,#fbd56a,#e8a317);border:0;border-radius:99px;padding:10px 20px;box-shadow:0 6px 16px rgba(232,163,23,.35)}.inst[hidden]{display:none}
.dev{max-width:440px;margin:24px auto 0;text-align:center;border:1px solid #8a6420;border-radius:18px;padding:16px 14px;background:linear-gradient(160deg,rgba(245,185,66,.16),rgba(193,18,31,.12));color:var(--ink)}
.dev-t{font-weight:900;font-size:1.02rem;color:var(--gold);line-height:1.7;direction:rtl}
.dev p{margin:8px 0 0;font-size:.82rem;line-height:1.6;color:var(--muted)}.dev p.ur{direction:rtl;color:var(--ink);font-weight:600}
.dev-btns{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.dev-btns a{display:block;text-decoration:none;font-weight:800;font-size:.92rem;border-radius:12px;padding:11px 6px;color:#2a1600;background:linear-gradient(135deg,#fbd56a,#e8a317)}
.dev-btns a.w{color:#fff;background:linear-gradient(135deg,#25d366,#128c4a)}

/* ---- New Deal Popup Styles ---- */
.deal {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(12, 6, 3, 0.85);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  cursor: pointer;
  animation: dfade 0.25s ease-out;
}
.deal-card {
  position: relative;
  width: 100%;
  max-width: 420px;
  border-radius: 20px;
  overflow: hidden;
  border: 3px solid var(--gold);
  box-shadow: 0 0 0 5px rgba(245, 185, 66, 0.2), 0 20px 60px rgba(0, 0, 0, 0.8);
  animation: dpop 0.4s cubic-bezier(.15, 1.3, .3, 1);
  cursor: default;
}
.deal-card img {
  display: block;
  width: 100%;
  height: auto;
}
.deal-x {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.8);
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  font-size: 24px;
  font-weight: bold;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  transition: background 0.2s;
}
.deal-x:hover {
  background: rgba(193, 18, 31, 0.9);
}
@keyframes dfade { from { opacity: 0; } }
@keyframes dpop { from { opacity: 0; transform: scale(0.7); } }
@media (prefers-reduced-motion: reduce) { .deal, .deal-card { animation: none; } }

.dealbar{direction:rtl;text-align:center;margin:10px 0 0;font-size:.88rem;font-weight:700;line-height:1.7}
.dealbar:empty{display:none}
.dealbar .ok{background:linear-gradient(135deg,#123d29,#1b6b45);color:#c9ffe0;border:1px solid #2f9c66;border-radius:12px;padding:9px 10px}
.dealbar .need{background:#1d160b;border:1px solid #8a6420;border-radius:12px;padding:9px 10px 10px;color:var(--ink)}
.dealbar .need b{color:var(--gold)}
.dealbar .pg{height:7px;margin-top:7px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;direction:ltr}
.dealbar .pg i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#e8a317,#fbd56a);transition:width .3s}
#offer h2{margin-top:18px}
#offer h2 span{font-size:1.28em;background:linear-gradient(#fff6bd,#f7c93a 50%,#e8a317);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 6px rgba(240,86,30,.55))}
#offer h2 span::before{content:"🔥 ";-webkit-text-fill-color:initial}
#offer h2 em{background:#c1121f;color:#fff;border-color:#fbd56a}
#offer .dish{position:relative;background:linear-gradient(135deg,#8f0d16 0%,#d11a1f 55%,#f0561e 100%);border:2px solid #fbd56a;box-shadow:0 8px 22px rgba(193,18,31,.5);animation:hotglow 1.8s ease-in-out infinite}
#offer .dish::after{content:"🔥 HOT";position:absolute;top:0;right:0;background:linear-gradient(135deg,#fbd56a,#e8a317);color:#4a1200;font-weight:900;font-size:.68rem;letter-spacing:.5px;padding:4px 11px;border-radius:0 12px 0 12px}
#offer .name{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
#offer .price{background:linear-gradient(135deg,#fff3b0,#f7c93a);color:#5a1000;padding:3px 10px;border-radius:9px}
#offer .thumb{background:rgba(0,0,0,.28);box-shadow:0 0 0 2px #fbd56a}
#offer .add{background:rgba(0,0,0,.35);border-color:#fff}
@keyframes hotglow{0%,100%{box-shadow:0 8px 22px rgba(193,18,31,.5),0 0 0 0 rgba(251,213,106,.55)}50%{box-shadow:0 8px 30px rgba(240,86,30,.7),0 0 0 7px rgba(251,213,106,0)}}
@media (prefers-reduced-motion:reduce){#offer .dish{animation:none}}
.vis[hidden]{display:none}.vis b{color:var(--gold);font-size:1.05rem;letter-spacing:.5px}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:20px 12px 100px;border-top:1px solid var(--line)}
.cbar{display:none;position:fixed;z-index:20;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(5,4,3,.93);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.cbar button{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:876px;margin:auto;border:0;border-radius:12px;padding:14px 17px;background:var(--red);color:#fff;font-size:1rem;font-weight:900;cursor:pointer}
#ccount{font-style:normal;display:inline-grid;place-items:center;min-width:23px;height:23px;border-radius:50%;background:#fff;color:var(--red);margin-right:7px;font-size:.8rem}
.ov{display:none;position:fixed;inset:0;z-index:30;background:#000b;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{width:100%;max-width:620px;max-height:85dvh;overflow:auto;background:#100c06;border:1px solid #4a3a18;border-radius:20px 20px 0 0;padding:17px 16px calc(18px + env(safe-area-inset-bottom))}
.sh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.sh h3{margin:0;font-size:1.25rem}.x{background:#333;color:#fff;border:0;border-radius:50%;width:35px;height:35px;font-size:1.4rem;cursor:pointer}
.ci{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.ci .t{font-weight:800}.ci small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.qty{display:flex;align-items:center;gap:9px}.qty button{width:29px;height:29px;border:1px solid #6b5420;border-radius:8px;background:#1d160b;color:#fff;font-size:1rem}
.ci .p{color:var(--gold);font-weight:800;white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:900;padding:16px 0}
.tot span:last-child{color:var(--gold)}
.sheet>.wa{display:flex;justify-content:center;align-items:center;gap:8px;padding:13px;background:var(--green);border-radius:10px;font-weight:900}
.cl{width:100%;margin-top:9px;padding:11px;background:#333;border:1px solid #555;color:#fff;border-radius:10px;font-weight:800}
.hours{color:#eee;margin:0 0 10px}.hours b{color:var(--gold)}
.st{display:inline-block;margin-left:6px;font-size:.75rem;font-weight:800;border-radius:99px;padding:3px 9px}.st.o{background:#123d29;color:#7ff0b0}.st.c{background:#4a1a1d;color:#ffb3b8}
.rev{width:calc(100% - 24px);max-width:876px;margin:0 auto 25px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:18px 16px}
.rev h3{margin:0 0 4px;font-size:1.25rem}.rev p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.stars{display:flex;gap:4px}.stars button{background:none;border:0;padding:2px;font-size:2.3rem;line-height:1;color:#7a5a48;cursor:pointer}.stars button.on{color:var(--gold);text-shadow:0 0 12px #f5b94266}
#rtext{min-height:22px;margin:4px 0 12px;font-weight:800;color:var(--gold)}
.rev input,.rev textarea{display:block;width:100%;margin-bottom:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);font:inherit;font-size:1rem;outline:0}
.rev input:focus,.rev textarea:focus{border-color:var(--gold)}.rev textarea{resize:vertical;min-height:100px}
.rsend{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:13px;background:var(--green);color:#fff;font:inherit;font-weight:900;font-size:1rem;cursor:pointer}
.rev small{display:block;margin-top:10px;color:var(--muted);text-align:center}
@media(min-width:650px){main{padding-left:18px;padding-right:18px}.dish{padding:14px}.thumb{width:110px;height:92px;flex-basis:110px}.loc{margin-left:18px;margin-right:18px}}
</style>
</head>
