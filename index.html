<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Error 404</title>
<style>
  /* ====== سیٹنگ: یہاں سے بدلیں ======
     پیغام بدلنے کے لیے نیچے <script> میں MODE بدلیں:
     "404"     -> Error 404 دکھائے گا
     "blocked" -> Blocked دکھائے گا
  */
  :root {
    --bg: #f6f6f4;
    --fg: #1d1d1b;
    --muted: #6b6b66;
    --accent: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; --accent: #e5604f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  main { max-width: 480px; }
  .code {
    font-size: clamp(72px, 22vw, 150px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--accent);
    margin: 0;
  }
  h1 { font-size: 1.4rem; margin: 16px 0 8px; }
  p { color: var(--muted); line-height: 1.6; margin: 0; }
</style>
</head>
<body>
<main>
  <p class="code" id="code">404</p>
  <h1 id="title">Page not found</h1>
  <p id="msg">The page you are looking for does not exist or has been moved.</p>
</main>

<script>
  // "404" یا "blocked" لکھیں
  var MODE = "404";

  var content = {
    "404": {
      code: "404",
      title: "Page not found",
      msg: "The page you are looking for does not exist or has been moved.",
      tab: "Error 404"
    },
    "blocked": {
      code: "Blocked",
      title: "Access blocked",
      msg: "Access to this website is currently restricted.",
      tab: "Blocked"
    }
  };

  var c = content[MODE] || content["404"];
  document.getElementById("code").textContent = c.code;
  document.getElementById("title").textContent = c.title;
  document.getElementById("msg").textContent = c.msg;
  document.title = c.tab;
  if (c.code === "Blocked") {
    document.getElementById("code").style.fontSize = "clamp(48px, 15vw, 110px)";
  }
</script>
</body>
</html>
